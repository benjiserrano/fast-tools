[package]
name = "fast-tools"
version = "0.1.0"
description = "Navaja suiza portable para desarrolladores"
edition = "2021"
rust-version = "1.85"

[lib]
name = "fast_tools_lib"
crate-type = ["lib"]

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
serde_norway = "0.9"
toml = "0.9"
quick-xml = "0.42"
csv = "1.4"
calamine = { version = "0.36", features = ["dates"] }
rust_xlsxwriter = "0.92"
chrono = "0.4"
tauri-plugin-dialog = "2"
sha2 = "0.10.9"
sha1 = "0.10.7"
md-5 = "0.10.6"
blake3 = "1.8.7"
crc32fast = "1.5.2"
hmac = "0.12.1"
ulid = "3.0.0"
bcrypt = "0.19.3"
argon2 = "0.5.3"
base64 = "0.23.1"
similar = "2.7.0"
sqlformat = "0.3.5"
x509-parser = "0.18.1"
uuid = { version = "1.20.0", features = ["v4", "v7"] }
rand = "0.9.5"
image = "0.25.6"
resvg = "0.45.1"
kamadak-exif = "0.6.1"
fast_qr = { version = "0.14.0", features = ["image"] }
color_quant = "2.0.0"
zip = "8"
futures-util = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "http2"] }
regex = "1.13.1"
croner = "4.0.0"
url = "2.5.8"
chrono-tz = "0.10.4"

# Binario portable: prioriza tamaño sobre tiempo de compilación.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
rcgen = "0.14.7"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
